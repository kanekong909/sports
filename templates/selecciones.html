<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selecciones del Mundo</title>
  <link rel="stylesheet" href="./../css/selecciones.css">
</head>
<body>

  <header>
    <h1>Selecciones de Fútbol</h1>

    <select id="filtroConfederacion">
      <option value="TODAS">Todas las Confederaciones</option>
      <option value="UEFA">UEFA</option>
      <option value="CONMEBOL">CONMEBOL</option>
      <option value="CONCACAF">CONCACAF</option>
      <option value="CAF">CAF</option>
      <option value="AFC">AFC</option>
      <option value="OFC">OFC</option>
    </select>

    <!-- 🔎 Buscador -->
    <input type="text" id="buscador" placeholder="Buscar selección...">
  </header>

  <main id="contenedorSelecciones"></main>

  <footer>
    <button id="volverBtn">⬅ Volver</button>
  </footer>

  <!-- Modal de Historial de Partidos -->
  <div id="modalPartidos" class="modal-partidos hidden">
    <div class="modal-content-partidos">
      <div class="modal-header-partidos">
        <div class="equipo-titulo-modal">
          <img id="escudoModalPartidos" src="" alt="" class="escudo-modal-partidos">
          <h2 id="nombreEquipoModal">Historial de Partidos</h2>
        </div>
        <button id="cerrarModalPartidos" class="cerrar-modal">×</button>
      </div>

      <!-- FILTROS DEL MODAL -->
      <div class="modal-filtros">
        <div class="filtro-izq">
          <input type="text" id="buscarPartido" placeholder="Buscar rival, estadio..." class="input-filtro">
          
          <select id="filtroTipo" class="select-filtro">
            <option value="TODOS">Todos los partidos</option>
            <option value="Clasificación">Clasificación</option>
            <option value="Amistoso">Amistoso</option>
            <option value="Mundial">Mundial</option>
            <option value="Copa América">Copa América</option>
            <option value="Eurocopa">Eurocopa</option>
            <option value="Eliminatorias">Eliminatorias</option>
          </select>

          <select id="filtroResultado" class="select-filtro">
            <option value="TODOS">Todos los resultados</option>
            <option value="V">Victorias</option>
            <option value="E">Empates</option>
            <option value="D">Derrotas</option>
          </select>
        </div>

        <div class="contador-partidos">
          <span id="contadorMostrar">0</span> / <span id="contadorTotal">0</span> partidos
        </div>
      </div>

      <div class="modal-body-partidos">
        <div id="listaPartidos"></div>
        <div id="sinPartidos" class="sin-resultados-modal">
          No hay partidos que coincidan con los filtros
        </div>
      </div>
    </div>
  </div>

  <script src="./../js/selecciones.js"></script>
</body>
</html>
