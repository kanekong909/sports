<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugadores del Equipo</title>
  <link rel="stylesheet" href="./../css/jugadores_campo.css">
  <style>

  </style>
</head>

<body>
 <header>
    <h1 id="tituloEquipo">Jugadores</h1>
    <p>Selecciona un jugador para ver detalles</p>
  </header>

  <div id="jugadoresContainer" class="jugadores-grid">
    <div class="loading">Cargando jugadores</div>
  </div>

  <button id="volverBtn">⬅ Volver</button>

  <div id="playerModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>

      <div class="modal-header">
        <img id="modalImg" src="" alt="Jugador" />
        <h2 id="modalNombre"></h2>
        <p id="modalPos"></p>
      </div>

      <div class="modal-info">
        <p><strong>Nacionalidad:</strong> <span id="modalNac"></span></p>
        <p><strong>Fecha de nacimiento:</strong> <span id="modalFecha"></span></p>
        <p><strong>Número:</strong> <span id="modalNum"></span></p>
        <p><strong>Estado:</strong> <span id="modalEstado"></span></p>
        <p><strong>Altura:</strong> <span id="modalAltura"></span></p>
        <p><strong>Peso:</strong> <span id="modalPeso"></span></p>
      </div>

      <div class="modal-extra">
        <h3>Estadísticas</h3>
        <p><strong>Partidos (club):</strong> <span id="modalPartidosClub"></span></p>
        <p><strong>Goles (club):</strong> <span id="modalGolesClub"></span></p>
        <p><strong>Asistencias (club):</strong> <span id="modalAsistClub"></span></p>
        <p><strong>Partidos (selección):</strong> <span id="modalPartidosSel"></span></p>
        <p><strong>Goles (selección):</strong> <span id="modalGolesSel"></span></p>
      </div>
    </div>
  </div>

  <script src="./../js/jugadores_fu.js"></script>
</body>

</html>
