<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugadores del Equipo</title>
  <link rel="stylesheet" href="./../css/jugadores_campo.css">
  <style>
   
  </style>
</head>
<body>
  <header>
    <h1 id="tituloEquipo">Jugadores</h1>
    <p>Selecciona un jugador para ver detalles</p>
  </header>

  <div id="jugadoresContainer" class="jugadores-grid">
    <div class="loading">Cargando jugadores</div>
  </div>

  <button id="volverBtn">⬅ Volver</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const nombreEquipo = params.get("equipo");

    const contenedor = document.getElementById("jugadoresContainer");
    const titulo = document.getElementById("tituloEquipo");

    fetch("./../data/data.json")
      .then(res => res.json())
      .then(data => {
        const equipo = data.equipos.find(e => e.nombre === nombreEquipo);

        if (!equipo) {
          contenedor.innerHTML = '<div class="mensaje">⚠️ No se encontró el equipo</div>';
          return;
        }

        titulo.textContent = equipo.nombre + " - Jugadores";

        const jugadoresIds = equipo.jugadores || [];
        const jugadores = jugadoresIds
          .map(id => data.jugadores.find(j => j.id === id))
          .filter(Boolean);

        if (!jugadores.length) {
          contenedor.innerHTML = '<div class="mensaje">Este equipo no tiene jugadores registrados</div>';
          return;
        }

        contenedor.innerHTML = '';

        jugadores.forEach((j, index) => {
          const card = document.createElement("div");
          card.classList.add("player-card");
          card.style.animationDelay = `${index * 0.1}s`;

          card.innerHTML = `
            <img src="${j.imagen_url || '../assets/img/default_player.png'}" alt="${j.nombre}" />
            <h4>${j.nombre}</h4>
            <small>${j.posiciones ? j.posiciones.join(", ") : "Sin posición"}</small>
          `;

          card.addEventListener("click", () => {
            const q = new URLSearchParams({ jugador: j.id }).toString();
            window.location.href = `jugador_detalle_fu.html?${q}`;
          });

          contenedor.appendChild(card);
        });
      })
      .catch(error => {
        contenedor.innerHTML = '<div class="mensaje">❌ Error al cargar los datos</div>';
        console.error('Error:', error);
      });

    document.getElementById("volverBtn").addEventListener("click", () => {
      window.history.back();
    });
  </script>
</body>
</html>
