<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipos de Conferencia</title>
  <link rel="stylesheet" href="./../css/conferencia.css" />
</head>

<body>
  <header>
    <h1 id="tituloConferencia">Conferencia</h1>
    <p>Selecciona un equipo para ver detalles</p>
  </header>

  <div class="logo-titulo">
    <img id="logoLiga" src="../assets/img/default_league.png" alt="Logo Liga" />
    <p id="descripcionLiga">Equipos disponibles en esta conferencia</p>
  </div>

  <main class="contenedor-cards" id="equiposContainer">
    <!-- Los equipos se cargan dinámicamente -->
  </main>

  <footer>
    <button id="volverBtn">⬅ Conferencias</button>
  </footer>

  <script>
    // Obtener los parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    const nombreConf = params.get("conferencia");
    const nombreLiga = params.get("liga");

    fetch("./../data/data.json")
      .then(res => res.json())
      .then(data => {
        const basket = data.deportes.find(d => d.nombre.toLowerCase() === "baloncesto");

        if (!basket) {
          document.getElementById("descripcionLiga").textContent = "No se encontró el deporte Baloncesto.";
          return;
        }

        let conferenciaEncontrada = null;
        let ligaEncontrada = null;

        // Buscar la conferencia
        if (Array.isArray(basket.conferencias)) {
          conferenciaEncontrada = basket.conferencias.find(c => c.nombre === nombreConf);
          if (conferenciaEncontrada) {
            ligaEncontrada = conferenciaEncontrada.ligas.find(l => l.nombre === nombreLiga);
          }
        }

        // Si no existe imagen de la liga, ocultar el logo
        if (!ligaEncontrada.imagen_url) {
          document.getElementById("logoLiga").style.display = "none";
        }

        const titulo = document.getElementById("tituloConferencia");
        const logo = document.getElementById("logoLiga");
        const contenedor = document.getElementById("equiposContainer");

        if (!ligaEncontrada) {
          titulo.textContent = nombreConf || "Conferencia desconocida";
          contenedor.innerHTML = `<p>No se encontró información para la liga "${nombreLiga}".</p>`;
          return;
        }

        // Mostrar información de la conferencia
        titulo.textContent = `${nombreConf} - ${ligaEncontrada.nombre}`;
        // logo.src = ligaEncontrada.imagen_url || "../assets/img/default_league.png";
        logo.alt = ligaEncontrada.nombre;
        document.getElementById("descripcionLiga").textContent = "Equipos participantes:";

        // Renderizar equipos
        contenedor.innerHTML = "";
        ligaEncontrada.equipos.forEach(id => {
          const eq = data.equipos.find(e => e.id === id);
          if (!eq) return;

          const card = document.createElement("div");
          card.classList.add("card");
          card.innerHTML = `
            <img src="${eq.escudo_url || "../assets/img/default_team.png"}" alt="${eq.nombre}" />
            <div class="card-info">
              <h2>${eq.nombre}</h2>
              <p>${eq.entrenador || "Entrenador no disponible"}</p>
            </div>
          `;

          // Al hacer clic → equipo.html
          card.addEventListener("click", () => {
            const query = new URLSearchParams({ equipo: eq.nombre }).toString();
            window.location.href = `equipo.html?${query}`;
          });

          contenedor.appendChild(card);
        });
      })
      .catch(err => console.error("Error cargando conferencia:", err));

    document.getElementById("volverBtn").addEventListener("click", () => {
      window.location.href = "baloncesto.html";
    });
  </script>
</body>
</html>
